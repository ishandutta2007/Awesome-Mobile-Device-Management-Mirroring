<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#161531"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseAura {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes signalRing {
        0% { r: 6; opacity: 1; }
        100% { r: 24; opacity: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .anim-aura {
        animation: pulseAura 4s ease-in-out infinite;
        transform-origin: 940px 190px;
      }
      .anim-stream {
        stroke-dasharray: 8 6;
        animation: streamFlow 2s linear infinite;
      }
      .anim-ring {
        animation: signalRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .anim-float {
        animation: floatCard 5s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix Pattern Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,380 M 300,0 L 300,380 M 450,0 L 450,380 M 600,0 L 600,380 M 750,0 L 750,380 M 900,0 L 900,380 M 1050,0 L 1050,380" />
  </g>

  <!-- Ambient Light Pulse Aura -->
  <circle class="anim-aura" cx="940" cy="190" r="140" fill="url(#glowPulse)" />
  <circle cx="200" cy="80" r="120" fill="url(#glowPulse)" opacity="0.3"/>

  <!-- Left Foreground Typography Section -->
  <g class="font-sans" transform="translate(60, 45)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 10)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">MOBILE ECOSYSTEM &amp; MDM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#textGrad)" font-size="36" font-weight="800" letter-spacing="-0.5">
      Awesome Mobile Device Management
    </text>
    <text x="0" y="126" fill="url(#accentGrad)" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Screen Mirroring
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94a3b8" font-size="15" font-weight="400">
      Curated directory of SaaS suites, native protocols, and open-source tools
    </text>
    <text x="0" y="188" fill="#64748b" font-size="13.5" font-weight="400">
      Zero-latency physical screen casting • Enterprise UEM / MDM • Self-hosted device farms
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#38bdf8" font-size="13">⚡</text>
        <text x="32" y="20" fill="#e2e8f0" font-size="12" font-weight="600">&lt; 35ms Latency</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#34d399" font-size="13">🔒</text>
        <text x="32" y="20" fill="#e2e8f0" font-size="12" font-weight="600">Native &amp; Private</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(310, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#a78bfa" font-size="13">📱</text>
        <text x="32" y="20" fill="#e2e8f0" font-size="12" font-weight="600">Android &amp; iOS Control</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(475, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="20" fill="#f43f5e" font-size="13">🏢</text>
        <text x="32" y="20" fill="#e2e8f0" font-size="12" font-weight="600">Enterprise MDM</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Graphics: Interactive Device Mirroring Mockup -->
  <g class="anim-float font-sans" transform="translate(710, 48)">
    <!-- Desktop Monitor Frame -->
    <g transform="translate(180, 20)">
      <!-- Monitor Stand -->
      <rect x="90" y="210" width="30" height="45" fill="#334155" rx="3"/>
      <path d="M 60,255 L 150,255 L 140,265 L 70,265 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      
      <!-- Monitor Body -->
      <rect x="0" y="0" width="210" height="210" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2.5" filter="url(#glowEffect)"/>
      <rect x="8" y="8" width="194" height="194" rx="6" fill="#020617"/>
      
      <!-- Screen Top Bar -->
      <rect x="8" y="8" width="194" height="20" fill="#1e293b"/>
      <circle cx="20" cy="18" r="3.5" fill="#ef4444"/>
      <circle cx="32" cy="18" r="3.5" fill="#f59e0b"/>
      <circle cx="44" cy="18" r="3.5" fill="#10b981"/>
      <text x="75" y="22" fill="#94a3b8" font-size="9" font-weight="500">Desktop Client (scrcpy)</text>

      <!-- Mirrored Screen on Desktop Display -->
      <rect x="35" y="36" width="70" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="40" y="42" width="60" height="138" rx="4" fill="#090d16"/>
      <circle cx="70" cy="48" r="2" fill="#64748b"/>
      <!-- UI Wireframe on mirrored screen -->
      <rect x="44" y="56" width="52" height="14" rx="3" fill="#38bdf8" opacity="0.8"/>
      <rect x="44" y="74" width="24" height="8" rx="2" fill="#6366f1" opacity="0.7"/>
      <rect x="72" y="74" width="24" height="8" rx="2" fill="#a855f7" opacity="0.7"/>
      <rect x="44" y="86" width="52" height="28" rx="3" fill="#1e293b"/>
      <rect x="44" y="118" width="52" height="18" rx="3" fill="#1e293b"/>
      <rect x="44" y="140" width="52" height="34" rx="3" fill="#1e293b"/>

      <!-- Console / Metrics overlay in desktop window -->
      <rect x="115" y="36" width="80" height="150" rx="4" fill="#0b1329" stroke="#334155" stroke-width="0.8"/>
      <text x="120" y="50" fill="#38bdf8" font-size="8" font-weight="700">STREAM STATS</text>
      <text x="120" y="66" fill="#a7f3d0" font-size="8">FPS: 60.0</text>
      <text x="120" y="80" fill="#a7f3d0" font-size="8">Latency: 28ms</text>
      <text x="120" y="94" fill="#cbd5e1" font-size="8">Res: 1080p</text>
      <text x="120" y="108" fill="#cbd5e1" font-size="8">Codec: H.264</text>
      <text x="120" y="122" fill="#cbd5e1" font-size="8">Audio: Passthrough</text>
      <rect x="120" y="132" width="70" height="4" rx="2" fill="#1e293b"/>
      <rect x="120" y="132" width="58" height="4" rx="2" fill="#38bdf8"/>
      <text x="120" y="152" fill="#f43f5e" font-size="8" font-weight="600">● LIVE ADB LINK</text>
    </g>

    <!-- Mobile Device (Physical Phone) -->
    <g transform="translate(10, 55)">
      <!-- Outer Phone Body -->
      <rect x="0" y="0" width="85" height="175" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" filter="url(#glowEffect)"/>
      <rect x="5" y="6" width="75" height="163" rx="12" fill="#030712"/>
      
      <!-- Camera Notch -->
      <circle cx="42.5" cy="14" r="3.5" fill="#1e293b"/>
      <circle cx="42.5" cy="14" r="1.5" fill="#38bdf8"/>

      <!-- Phone Screen UI -->
      <rect x="9" y="24" width="67" height="138" rx="8" fill="#090d16"/>
      <rect x="13" y="28" width="59" height="16" rx="3" fill="#38bdf8" opacity="0.9"/>
      <text x="21" y="39" fill="#020617" font-size="7.5" font-weight="700">DEVICE #01</text>
      <rect x="13" y="48" width="28" height="10" rx="2" fill="#6366f1" opacity="0.8"/>
      <rect x="44" y="48" width="28" height="10" rx="2" fill="#a855f7" opacity="0.8"/>
      <rect x="13" y="62" width="59" height="34" rx="4" fill="#1e293b"/>
      <rect x="13" y="100" width="59" height="22" rx="4" fill="#1e293b"/>
      <rect x="13" y="126" width="59" height="30" rx="4" fill="#1e293b"/>

      <!-- Navigation pill -->
      <rect x="30" y="163" width="25" height="3" rx="1.5" fill="#64748b"/>

      <!-- Pulsing Signal Ring on Device -->
      <circle cx="42.5" cy="90" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="anim-ring"/>
      <circle cx="42.5" cy="90" r="4" fill="#38bdf8"/>
    </g>

    <!-- Dynamic Stream Flow / Connection Beam -->
    <g>
      <!-- Base Glowing Line -->
      <path d="M 95,145 C 130,145 140,115 180,115" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.3"/>
      <!-- Animated Stream Flow Dash -->
      <path class="anim-stream" d="M 95,145 C 130,145 140,115 180,115" fill="none" stroke="url(#beamGrad)" stroke-width="3.5" filter="url(#glowEffect)"/>
      <!-- Stream Data Pulse Nodes -->
      <circle cx="138" cy="130" r="4" fill="#38bdf8"/>
    </g>
  </g>
</svg>
